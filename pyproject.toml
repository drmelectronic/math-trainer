[project]
name = "math-trainer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pygame>=2.6.0"]

[project.optional-dependencies]
game = ["pygame>=2.6.0"]

[project.scripts]
math-trainer = "math_trainer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_trainer"]

[tool.hatch.build.targets.sdist]
include = ["src/math_trainer", "tests", "PRD.md"]
